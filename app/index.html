<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SparkShot Studio</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif}body{margin:0;background:#090b13;color:#f1f3fc}main{max-width:860px;margin:60px auto;padding:24px}h1{font-size:42px;margin-bottom:6px}.muted{color:#a1a9c3}section{padding:28px;background:#151927;border:1px solid #33394a;border-radius:18px}label{display:block;margin:15px 0 6px}input,select,textarea{box-sizing:border-box;width:100%;background:#0e1220;color:#fff;border:1px solid #465069;border-radius:9px;padding:12px}button{margin-top:20px;background:#8c86ff;color:#111321;font-weight:750;padding:13px 22px;border:0;border-radius:10px;cursor:pointer}video{width:100%;margin-top:20px;border-radius:12px}#status{margin-top:16px;color:#acbaff}
</style></head><body><main><h1>SparkShot <span style="color:#9a92ff">Studio</span></h1><p class="muted">DGX Spark-oriented AI video research · Local prototype</p><section><form id="form"><label>Reference image</label><input type="file" name="image" accept="image/png,image/jpeg,image/webp" required><label>Scene prompt</label><textarea name="prompt" rows="3">A cinematic portrait with beautiful soft lighting</textarea><label>Camera motion</label><select id="preset" name="preset"></select><label>Seconds</label><input name="seconds" type="number" min="1" max="5" value="3"><button type="submit">Generate video</button></form><p id="status">Ready. Default mode produces a camera-motion preview, not generative AI.</p><video id="video" controls hidden></video><p><a id="download" hidden>Download MP4</a></p></section></main><script>
const preset=document.querySelector('#preset'), status=document.querySelector('#status'), video=document.querySelector('#video'), download=document.querySelector('#download');
fetch('/api/presets').then(r=>r.json()).then(data=>{Object.keys(data).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=k.replaceAll('_',' ');preset.append(o)})});
document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();video.hidden=true;download.hidden=true;status.textContent='Submitting job…';try{const r=await fetch('/api/jobs',{method:'POST',body:new FormData(e.target)});const j=await r.json();if(!r.ok)throw Error(JSON.stringify(j));const poll=async()=>{const res=await fetch('/api/jobs/'+j.id);const x=await res.json();status.textContent='Status: '+x.status;if(x.status==='done'){video.src=x.video;video.hidden=false;download.href=x.video;download.hidden=false;download.download='sparkshot.mp4'}else if(x.status==='error'){status.textContent=x.error}else setTimeout(poll,1500)};poll()}catch(err){status.textContent='Error: '+err.message}});
</script></body></html>
